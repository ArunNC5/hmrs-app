name: Deploy HMRS to DEV ECS

on:
  workflow_run:
    workflows: ["HMRS Enterprise CI Pipeline"]
    types:
      - completed

jobs:

  deploy-dev:

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: hmrs-app
      ECS_CLUSTER: hmrs-dev-cluster
      ECS_SERVICE: hmrs-dev-service

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/hmrs-app:${{ github.sha }} .

      - name: Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/hmrs-app:${{ github.sha }}

      - name: Render ECS Task Definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs/task-definition-dev.json
          container-name: hmrs-app
          image: ${{ steps.login-ecr.outputs.registry }}/hmrs-app:${{ github.sha }}

      - name: Deploy ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: hmrs-dev-service
          cluster: hmrs-dev-cluster
          wait-for-service-stability: true
