name: HMRS Enterprise DevSecOps Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: hmrs-app
  ECS_CLUSTER: hmrs-cluster
  ECS_SERVICE: hmrs-service
  IMAGE_TAG: ${{ github.sha }}

jobs:

  ci-cd:

    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # GIT CLONE
      # -----------------------------
      - name: Checkout Source
        uses: actions/checkout@v4

      # -----------------------------
      # JAVA SETUP
      # -----------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # -----------------------------
      # MAVEN BUILD
      # -----------------------------
      - name: Build Application
        run: mvn clean package -DskipTests

      # -----------------------------
      # UNIT TEST
      # -----------------------------
      - name: Run Unit Tests
        run: mvn test

      # -----------------------------
      # SONARQUBE CODE QUALITY
      # -----------------------------
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
          -Dsonar.projectKey=hmrs-app

      # -----------------------------
      # SECRETS SCAN
      # -----------------------------
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2

      # -----------------------------
      # SAST SCAN
      # -----------------------------
      - name: Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1

      # -----------------------------
      # DEPENDENCY VULNERABILITY SCAN
      # -----------------------------
      - name: OWASP Dependency Check
        run: |
          docker run --rm \
            -v $(pwd):/src \
            owasp/dependency-check \
            --scan /src \
            --format HTML

      # -----------------------------
      # DOCKER BUILD
      # -----------------------------
      - name: Build Docker Image
        run: |
          docker build \
          -t hmrs-app:${{ env.IMAGE_TAG }} .

      # -----------------------------
      # IMAGE VULNERABILITY SCAN
      # -----------------------------
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hmrs-app:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: 1

      # -----------------------------
      # AWS LOGIN
      # -----------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # -----------------------------
      # LOGIN TO ECR
      # -----------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------
      # DOCKER PUSH
      # -----------------------------
      - name: Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |

          docker tag \
          hmrs-app:${{ env.IMAGE_TAG }} \
          $ECR_REGISTRY/hmrs-app:${{ env.IMAGE_TAG }}

          docker push \
          $ECR_REGISTRY/hmrs-app:${{ env.IMAGE_TAG }}

      # -----------------------------
      # ECS DEPLOYMENT
      # -----------------------------
      - name: Deploy to ECS
        run: |

          aws ecs update-service \
            --cluster hmrs-cluster \
            --service hmrs-service \
            --force-new-deployment

      # -----------------------------
      # SMOKE TEST
      # -----------------------------
      - name: Application Smoke Test
        run: |
          echo "Deployment completed successfully"
