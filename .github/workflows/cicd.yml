name: HMRS Enterprise DevSecOps Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Select branch to deploy'
        required: true
        default: 'master'
        type: choice
        options:
          - master
          - dev
          - qa
          - stage
permissions:
  contents: read
  security-events: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: hmrs_np_app_repo
  ECS_CLUSTER: hmrs-cluster
  ECS_SERVICE: hmrs-service
  IMAGE_TAG: ${{ github.sha }}

jobs:

  ci-cd:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # GIT CLONE
      # --------------------------------
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
         ref: ${{ github.event.inputs.deploy_branch || github.ref_name }}

      # --------------------------------
      # JAVA SETUP
      # --------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # --------------------------------
      # BUILD
      # --------------------------------
      - name: Maven Build
        run: mvn clean package -DskipTests

  # Commenting UNIT TEST Temporarly 
      # --------------------------------
      # UNIT TEST
      # --------------------------------
     ### - name: Run Unit Tests
     ###   run: mvn test

      # --------------------------------
      # PMD CODE QUALITY
      # --------------------------------
      - name: PMD Scan
        run: mvn pmd:pmd

      # --------------------------------
      # SPOTBUGS SECURITY SCAN
      # --------------------------------
      - name: SpotBugs Scan
        run: mvn spotbugs:spotbugs
        
      - name: Upload SpotBugs Report
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: |
            **/target/spotbugsXml.xml
            **/target/site/spotbugs.html

      # --------------------------------
      # GITLEAKS SECRET SCAN
      # --------------------------------
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2

      # --------------------------------
      # SEMGREP SAST
      # --------------------------------
      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1

      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-report
          path: semgrep-report.json
        
      # --------------------------------
      # OWASP DEPENDENCY SCAN
      # --------------------------------

      - name: OWASP Dependency Check
        continue-on-error: true
        run: |
      
          docker run --rm \
            -e NVD_API_KEY=${{ secrets.NVD_API_KEY_NEW }} \
            -v $(pwd):/src \
            owasp/dependency-check \
            --scan /src \
            --format ALL \
            --out /src/dependency-check-report
            --nvdApiKey ${{ secrets.NVD_API_KEY_NEW }} 

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/
      # --------------------------------
      # DOCKER BUILD
      # --------------------------------
      - name: Build Docker Image
        run: |
          docker build \
          -t hmrs-app:${{ env.IMAGE_TAG }} .

      # --------------------------------
      # TRIVY IMAGE SCAN
      # --------------------------------
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hmrs-app:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
      # --------------------------------
      # TERRAFORM INFRA SCAN
      # --------------------------------
      - name: Terraform Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          quiet: true
          soft_fail: true

      # --------------------------------
      # AWS LOGIN USING ACCESS KEY
      # --------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # --------------------------------
      # LOGIN TO ECR
      # --------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------
      # PUSH IMAGE
      # --------------------------------
      - name: Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |

          docker tag \
          hmrs-app:${{ env.IMAGE_TAG }} \
          $ECR_REGISTRY/${{ env.ECR_REPOSITORY }} :${{ env.IMAGE_TAG }}

          docker tag \
          hmrs-app:${{ env.IMAGE_TAG }} \
          $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
      
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      # # --------------------------------
      # # ECS DEPLOY
      # # --------------------------------
      # - name: ECS Deploy
      #   run: |

      #     aws ecs update-service \
      #       --cluster hmrs-cluster \
      #       --service hmrs-service \
      #       --force-new-deployment

      # # --------------------------------
      # # DEPLOYMENT SUCCESS
      # # --------------------------------
